name: CI — Tests & Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (excludes live-API tests - no key in this job)
        run: pytest tests/ -v --tb=short

      - name: Run linter
        run: ruff check src/ tests/ scripts/

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest documents
        run: python scripts/ingest_documents.py

      - name: Run evaluation harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_evaluation.py

      - name: Check evaluation thresholds
        run: |
          python -c "
          import json
          with open('docs/evaluation_report.json') as f:
              r = json.load(f)
          m = r['metrics']
          assert m['retrieval_accuracy'] >= 0.85, f'Retrieval accuracy {m[\"retrieval_accuracy\"]} < 0.85'
          assert m['hallucination_rate'] <= 0.10, f'Hallucination rate {m[\"hallucination_rate\"]} > 0.10'
          assert m['classification_accuracy'] >= 0.80, f'Classification accuracy {m[\"classification_accuracy\"]} < 0.80'
          print('All evaluation thresholds passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: |
            docs/evaluation_report.md
            docs/evaluation_report.json
