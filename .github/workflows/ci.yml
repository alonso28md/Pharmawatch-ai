name: CI — Tests & Evaluation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_evaluation:
        description: "Run the paid evaluation (real model calls)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Run tests (live-model tests are opt-in and skipped here)
        run: pytest tests/ -v --tb=short

      - name: Run linter
        run: ruff check src/ tests/ scripts/

      - name: Check formatting
        run: ruff format --check src/ tests/ scripts/

      - name: Check documentation figures, links and claims
        run: python scripts/check_docs.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and lint
        run: npm run typecheck && npm run lint

      - name: Unit tests
        run: npm test

      - name: End-to-end tests (mock build, no backend, no model calls)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Production build
        run: npm run build

  evaluate:
    # Paid: only when started manually with run_evaluation=true.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.run_evaluation
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Ingest documents
        run: python scripts/ingest_documents.py

      - name: Run evaluation harness (v2, test split, 3 repetitions)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/run_evaluation.py --dataset v2 --split test --repetitions 3

      - name: Check every gating threshold in config/eval_thresholds.json
        run: python scripts/check_eval_thresholds.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: artifacts/evaluations/*.json
